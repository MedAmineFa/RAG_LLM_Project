services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: DOCUMENT
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DOCUMENT"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: rag_ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./ia_backend
    container_name: rag_backend
    env_file:
      - ./ia_backend/.env
    environment:
      CONNECTION: postgresql+psycopg2://postgres:admin@postgres:5432/DOCUMENT
      PGVECTOR_CONNECTION_STRING: postgresql+psycopg2://postgres:admin@postgres:5432/DOCUMENT
      EMBEDDING_MODEL: nomic-embed-text-v2-moe
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./ia_assistant
    container_name: rag_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data: